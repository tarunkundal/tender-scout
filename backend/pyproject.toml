[project]
name = "tenderscout-backend"
version = "0.1.0"
description = "TenderScout API, Celery workers and Beat (modular monolith)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "asyncpg==0.32.0",
    "celery==5.6.3",
    "fastapi==0.159.1",
    "pydantic-settings==2.16.1",
    "pyjwt[crypto]==2.15.1",
    "redis==8.1.0",
    "sqlalchemy[asyncio]==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
# Application, not a library: run from this directory with `uv run`, no build step.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[dependency-groups]
dev = [
    "ruff==0.17.1",
]
