# Local dev services. Ports are bound to 127.0.0.1 only.
name: tenderscout

# The app's database is the Neon dev branch `tender_scout_backend` (Neon Auth needs a real Neon
# DB), so the API, workers and `make migrate` do not use the `db` service below. Redis and
# Mailpit are still used for local dev; `db` is kept for offline experiments.
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tenderscout
      POSTGRES_PASSWORD: tenderscout
      POSTGRES_DB: tenderscout
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderscout -d tenderscout"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  db_data:
